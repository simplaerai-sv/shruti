name: Problem or idea
description: Something is broken, or you have a suggestion
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks! The three fields below are almost everything we need to work it out.
        **Do not paste your API key here**, and please leave out fragments of your
        work conversations.

        Українською писати теж можна.

  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - Windows
        - macOS (Apple Silicon)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the bottom left corner, for example 0.5.017
      placeholder: "0.5.017"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: |
        What you did, what you expected to see and what you saw instead.
        If this is a suggestion — just describe it in your own words.
    validations:
      required: true
